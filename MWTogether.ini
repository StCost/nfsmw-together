; NFS MW Together (MWT) settings - lives in the game's scripts\ folder

[Network]
; host = wait for the other player; client = connect to HostIP
Mode=host
; Host's IP address (LAN IP, or Radmin VPN / ZeroTier IP). Client only.
HostIP=127.0.0.1
; Host only, optional: the client's IP. The host then also sends to the client, so
; neither PC needs a firewall rule on a LAN / VPN. Leave empty to just wait.
ClientIP=
; UDP port (both sides use it). Over the internet without a VPN, the host must
; forward it on the router.
Port=47555
; State packets per second
SendRate=60

[Player]
Name=Player
; Colour of your blip on the other player's minimap and world map, RRGGBB (e.g. FF8800); empty = the game's own
Color=

[Ghost]
; Remote cars are shown this many ms in the past, interpolated between packets
; (smooth). Lower = less delay, more extrapolation when packets are late.
InterpDelayMs=100
; Show the other player's car in your world
Enabled=1
; Show what the other player's car is doing: front wheels, lights, nitrous (0/1)
SyncControls=1
; Show the other player's car damage: dents, broken parts and lights (0/1)
SyncDamage=1
; The other player's car collides (0/1): you bounce off it, and the traffic / cops /
; racers of the PC that owns them get pushed by it (each PC pushes its own cars).
Collisions=1
; Collisions stay off until the cars have been this many metres apart once
; (avoids spawning inside each other)
SafeDistance=10

[Traffic]
; Shared traffic: the host's traffic is mirrored on the client while the players
; are within ~350 m of each other (the client's own traffic is switched off there).
Sync=1
; Driver class for mirrored cars: 4 = none (no AI), 6 = remote player
MirrorClass=4
; Shared traffic inside races too (client side, 0/1). The client's own traffic cars follow the host's
; traffic cars (none are removed: race scripts own some of them). 0 = each player keeps their own
; traffic during a race
SharedInRaces=1
; Smooth handover (client side, 0/1): when you drive away from the host, the host's cars around
; you don't vanish - they drive on as your own traffic. When you come back, your own traffic cars stay
; until they are out of view, and the host's cars only appear where you can't see it happen (behind
; you or far away) or take over one of your nearby cars. 0 = the old instant switch
SmoothHandover=1

[Career]
; The host keeps a copy of the other player's career save (scripts\MWTogether-saves). If that player's
; own save is ever missing or older, it is restored from the host when they connect.
SaveSync=1
; When either player finishes an event first, both get the win (cash, unlocks, career progress)
SharedWins=1
; When either player completes a milestone (pursuit length, bounty, cost to state, speed trap...) the
; other player gets it too, with its reward, if their career is at the same Blacklist rival
SharedMilestones=1

[Start]
; Skip the EA logo, warning screen and intro movie when the game starts (0/1, off by default).
; Use this instead of the Widescreen Fix's SkipIntro: that one also skips every story movie in the career.
SkipIntro=0
; Load career free roam right after the profile loads (no menus). Then [AutoStart] isn't needed.
DirectFreeRoam=1
; Confirm the "load complete" screen after the title by itself
SkipLoadComplete=1
; Resume Free Roam in the safe house starts at once (no "leave the safe house?" question)
SkipLeaveSafeHouseDialog=1

[AutoStart]
; Drive the menus automatically after launch (the mod presses keys only while the
; game window is focused). Steps, comma separated:
;   ENTER LEFT RIGHT UP DOWN ESC   press that key
;   WAIT                           pause one interval
;   @Name.fng                      wait until that menu screen is open (re-presses the
;                                  previous key every 3 s if the screen doesn't come)
; Esc cancels. Screens: WS_MW_LS_Splash (Press START), MC_Main (load complete),
; MainMenu, MainMenu_Sub, Track_Select, Track_Options, Car_Select, Dialog.
Enabled=1
; Where to go: freeroam (uses Sequence below), safehouse (stop on the "Resume Free Roam"
; screen), race (Quick Race test)
Target=freeroam
DelayMs=0
IntervalMs=700
; Career free roam (default): Press START > Career > Resume Career > Resume Free Roam > Yes
Sequence=@WS_MW_LS_Splash.fng,ENTER,@MC_Main.fng,ENTER,@MainMenu.fng,ENTER,@MainMenu_Sub.fng,ENTER,WAIT,WAIT,WAIT,WAIT,ENTER,@Dialog.fng,LEFT,ENTER
; Quick Race test: Custom Race > Circuit > City Perimeter, 1 lap, 1 opponent, first car
; Sequence=@WS_MW_LS_Splash.fng,ENTER,@MC_Main.fng,ENTER,@MainMenu.fng,RIGHT,RIGHT,ENTER,@MainMenu_Sub.fng,RIGHT,ENTER,WAIT,ENTER,@Track_Select.fng,ENTER,@Track_Options.fng,LEFT,DOWN,DOWN,LEFT,LEFT,ENTER,@Car_Select.fng,ENTER,@Dialog.fng,ENTER

[Coop]
; Speedbreaker (slow motion) can't work with two players: keep it off and empty
NoSpeedbreaker=1
; With the speedbreaker off, holding its key / button flashes your headlights (the other player sees it too)
FlashLights=1
; While connected, opening the pause menu or the map doesn't stop the world (the other player keeps playing)
NoPause=1
; Keep the game running when its window isn't focused (alt-tab)
RunInBackground=1
; Also load the world around the other player, so cars near them keep full physics and collisions
StreamAroundPeer=1
; Wait on the starting grid until the other player has loaded too (up to 20 s), so you start together
StartTogether=1
; Both games put their own player on the same grid slot: the client moves to the slot its game
; gave the host, so the two cars stand apart on both screens from the countdown on (0/1)
SeparateGridSlots=1
; AI opponents pace themselves against whichever player is ahead (0 = against the host only)
CatchUpLeader=1
; No slow-motion moments while connected (speed traps, pursuit start / crash / finish cameras): everything in real time (0/1)
NoSlowMotion=1
; The other player sees the host's weather (rain, wet roads) (0/1)
SyncWeather=1
; Police in free roam are shared (0/1): heat goes to the hotter of you two, busting one busts both,
; the cooldown only runs while neither of you is seen and you escape together, the other player's
; cops show on your minimap and radar detector, and ramming one of their cops starts a pursuit on you.
; 0 = each of you has your own heat and pursuit
SharedPursuits=1
; No pursuit-start camera while connected: when the cops start chasing, the camera stays on your car
; instead of flying over to look at the police car (0/1)
NoPursuitCams=1
; Story scenes outside events (Blacklist rival movies, story movies, story cutscenes in the world):
; 0 = each game on its own, 1 = while one of you watches one, the other game waits (the world stops),
; and a movie you both watch is skipped only when both press skip, 2 = as 1, and a story movie also
; plays on the other game when its career has got that far
SyncStoryScenes=1

[UI]
; Menus accept input while their opening animation plays (the lock after you
; confirm something stays, so nothing can be activated twice)
IntroInput=1
; Menu animation speed: 1 = normal, 2 = 2x, 3 = 3x
MenuSpeed=2
; Notices (player joined / left ...) in the game's own banner, the one that shows song titles (1),
; or as a small line in the corner (0). The corner line is also used where the game can't show its banner
GameNotices=1
; How many seconds a notice stays on screen (2-60), in the game's banner and in the corner line
NoticeSeconds=10
; After a pursuit in free roam, close the result screens ("Bounty achieved", pursuit summary) by itself
; (0/1, this PC only). The busted / fine screen is never answered for you
SkipPursuitResults=0

[Window]
; Hide the Windows mouse arrow over the game (the game draws its own cursor)
HideCursor=1
; Start without taking the focus: the focus goes back to your previous window, the game loads into
; free roam in the background and stays muted until you click it (0/1)
StartInBackground=0

[Input]
; Detect a gamepad / wheel connected while the game runs (USB or Bluetooth), and one that was
; disconnected and connected again: the game picks it up as if it had been there at start (0/1)
GamepadHotplug=1
; Keep your controller bindings when the game starts without the pad. Without this the game resets
; the pad's bindings to the defaults and the next autosave stores that (0/1)
KeepPadBindings=1

[Debug]
; Show the status overlay (F8 toggles it; the choice is saved here)
Overlay=0
ToggleKey=0x77
; Test keys: F5 autopilot (the game's AI drives your car; again = you drive), F7 start the test event,
; F10 spawns a test car (the other player's last car, or a copy of yours), F11 removes it
TestKeys=0
; Test: the AI drives your car in free roam and races (F5 switches it off/on)
AutoPilot=0
; The autopilot uses nitrous on straights (0/1)
AutoPilotNos=1
; Performance diagnostics: fps, frame times and the mod's own cost, logged every 5 s (0/1)
Perf=0
; Log what the profile (memory card) screens do while the game boots (0/1)
BootTrace=0
